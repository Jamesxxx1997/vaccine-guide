name: Verify and publish Pages（旅遊資料由本機每日同步推送，GitHub 不再下載）
on:
  push:
    branches: [main]   # 本機每日 07:30 同步推上來的旅遊資料也要觸發部署（GitHub 端已不再自行下載）
  workflow_dispatch:
concurrency:
  group: vaccine-guide-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 測試套件已成長（39 檔、含 test_reference_coverage 約 5 分鐘）＋ od.cdc.gov.tw 逾時重試；20 分鐘會被 GitHub 以 cancelled 砍掉（2026-09-16）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify reviewed code and stored sources
        if: github.event_name == 'push'
        run: npm test
      - name: Verify parser and failure-retention invariants
        run: node --test tools/test_travel_sync.mjs
      - name: Verify fresh or retained dataset
        run: node tools/verify_current_travel.cjs
      - name: Package public static files only
        id: package
        run: node tools/package_pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.package.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified static site
        id: deployment
        uses: actions/deploy-pages@v4
